# Merged onto reader-ergonomics' own config, table by table; a value here wins (extending.md, the interface).
extends = "reader-ergonomics"

# The standard's three, and the answers file: it changes with every file it answers for, so it co-changes by construction.
[co_change]
exempt = ["standard.md", "llms.txt", "checks/judgments.toml"]

# The site loads the standard's own stylesheet (_standard/site.css, checked out in pages.yml), so there is none here
# to measure; reader-ergonomics extending.md asks such a repository to list none.
[readable_measure]
stylesheets = []

[sufficient_contrast]
stylesheets = []

# The headings the standard's decision-record shape requires (reader-ergonomics v1.20.0, shapes/decision-record.md).
[shape_conformance]
shapes = [{ name = "decision record", files = ["decisions/0*.md"], required = ["Context", "Decision", "Consequences", "See also"] }]

# Path questions are answered with their path quoted, so the quotes check stays strict.
[judgment_quotes]
optional = []

[bibliography_keys]
# A key names one work across the family (reader-ergonomics decision 0003); CI clones each name beside this repository.
family = ["reader-ergonomics",
          "reader-ergonomics-topic",
          "reader-ergonomics-blueprint"]
shared_links = []

# The scope-overlap check (checks/local/scope_overlap.py): the members are the repositories linked in the front page's
# member table, read from checkouts beside this repository. A warning, never an error, until the family has judged it.
[scope_overlap]
front_page = "README.md"
min_words = 3   # PROVISIONAL: the shortest shared run of words that counts as one claim; no study sets it
# The semantic pass (checks/local/scope_overlap_semantic.py, meaning tier): two "in" rows of different members whose
# cosine similarity is at least this value are a warning. PROVISIONAL: between the best non-overlap (0.65) and the
# worst planted paraphrase (0.76) of its tests; the family's closest pair scores 0.76.
semantic_threshold = 0.70

[standard_card]
facets = ["claims", "scope"]   # the principle groups, in the order the card shows them

# The shape this repository adds (shapes/scope-table.md): its documents are found by their Shape line.
[scope_table]

# Tables that name one arm of a person, a model and both name all three (principles/claims). Warns only.
[three_arms]
exempt = ["evidence/bibliography.md"]

[shape_example]
exempt = ["shapes/README.md", "shapes/examples/*"]   # the folder README, and the examples, which follow a shape and are not one

# The agent reader style (reader-styles/agent.md): the bounds on the start file and the memory index.
[agent_reader]
start_file_max_lines = 200   # PROVISIONAL: from the method's design (ai-augmented-project decision 0004); no study sets it
index_max_lines = 200        # PROVISIONAL: same
