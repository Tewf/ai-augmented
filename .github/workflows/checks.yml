name: Check against reader-ergonomics

# The checks live in Tewf/reader-ergonomics and are not copied here: CI checks out both
# repositories and runs that one's checks on this one.
# Tiers program and meaning run on every push and pull request; syntax and the online
# reference check run weekly, and on demand.
on:
  push:
  pull_request:
  schedule:
    - cron: "57 6 * * 1"   # Mondays
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run moot.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  every-push:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed   # outside the checked tree
    steps:
      - uses: actions/checkout@v4
        with:
          path: repository
          fetch-depth: 0   # co-change and the age of PROVISIONAL tags read the whole history
      - uses: actions/checkout@v4
        with:
          repository: Tewf/reader-ergonomics
          ref: b9732b9814c71768f722691f3c5049ec2b8ed378   # v1.19.2 (reader-ergonomics extending.md, Versions)
          path: standard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: standard/checks/meaning/requirements.txt
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('standard/checks/meaning/requirements.txt') }}
      - name: Install the meaning tier
        run: pip install -r standard/checks/meaning/requirements.txt
      - name: Clone the family beside this repository, for bibliography-keys
        run: |
          for name in $(python3 -c "import tomllib; print(*tomllib.load(open('repository/checks/config.toml', 'rb'))['bibliography_keys']['family'])"); do
            git clone --quiet --depth 1 "https://github.com/Tewf/$name" "$name"
          done
      # The semantic pass of the scope-overlap check (meaning tier) reads every member's scope table.
      - name: Clone every member of the front page's table beside this repository, for scope-overlap-semantic
        run: |
          members=$(PYTHONPATH=standard/checks python3 -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('scope_overlap', 'repository/checks/local/scope_overlap.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          print(*[name for name, _ in module.members_of(open('repository/README.md').read())])")
          for name in $members; do
            [ -d "$name" ] || git clone --quiet --depth 1 "https://github.com/Tewf/$name" "$name" || echo "::warning::could not clone $name"
          done
      - name: Run the unit tests of checks/
        env:
          READER_ERGONOMICS_CHECKS: ${{ github.workspace }}/standard/checks
        run: python3 -m unittest discover -s repository/checks
      - name: Check the repository, tiers program and meaning
        run: python3 standard/checks/run.py repository --tiers program,meaning --judge flag
      - name: List the questions left for judgment
        if: always()
        run: cat repository/checks/out/needs-judgment.md 2>/dev/null || echo "No questions for judgment."

  # The family's own check, beside the one above: it reads the scope table of every member the front page lists, so
  # it clones them all. It only warns (checks/local/scope_overlap.py says what it decides), and it also runs weekly,
  # since a member can change without a push here.
  scope-overlap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repository
      - uses: actions/checkout@v4
        with:
          repository: Tewf/reader-ergonomics
          ref: b9732b9814c71768f722691f3c5049ec2b8ed378   # v1.19.2 (reader-ergonomics extending.md, Versions)
          path: standard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone every member of the front page's table beside this repository
        run: |
          members=$(PYTHONPATH=standard/checks python3 -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('scope_overlap', 'repository/checks/local/scope_overlap.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          print(*[name for name, _ in module.members_of(open('repository/README.md').read())])")
          for name in $members; do
            git clone --quiet --depth 1 "https://github.com/Tewf/$name" "$name" || echo "::warning::could not clone $name"
          done
      - name: Compare the scope tables
        run: python3 standard/checks/run.py repository --tiers program --only scope-overlap --judge none

  weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repository
      - uses: actions/checkout@v4
        with:
          repository: Tewf/reader-ergonomics
          ref: b9732b9814c71768f722691f3c5049ec2b8ed378   # v1.19.2 (reader-ergonomics extending.md, Versions)
          path: standard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: standard/checks/syntax/requirements.txt
      - name: Install the syntax tier
        run: pip install -r standard/checks/syntax/requirements.txt
      - name: Check the repository, tier syntax
        run: python3 standard/checks/run.py repository --tiers syntax --judge flag
      - name: Resolve every reference online
        if: always()
        run: python3 standard/checks/run.py repository --online --only references --judge none
